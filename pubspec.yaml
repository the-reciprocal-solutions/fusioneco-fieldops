name: technician_portal
description: "Fusion Eco Technician Portal — field maintenance app."
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  # Native AR engine (slice 0: first device build). See packages/fe_ar/README.md.
  fe_ar:
    path: packages/fe_ar
  cupertino_icons: ^1.0.8

  # state + routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # localization (JSON-based, not the SDK's flutter_localizations)
  flutter_localization: ^0.4.1

  # network
  dio: ^5.7.0
  socket_io_client: ^2.0.3+1
  connectivity_plus: ^6.1.0

  # storage
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # ui
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.0.0

  # device capture — checklist sessions record a face photo and coordinates,
  # and notes can be spoken instead of typed
  image_picker: ^1.1.2
  record: ^7.1.1
  just_audio: ^0.9.42
  geolocator: ^13.0.2
  geocoding: ^5.0.0
  permission_handler: ^11.3.1

  # digital signature sign-off (close flow, Volume "Digital signatures")
  signature: ^6.4.0

  # utils
  uuid: ^4.5.1
  intl: ^0.20.1
  collection: ^1.19.0
  fl_chart: ^1.2.0
  mobile_scanner: ^7.4.0
  vibration: ^3.2.1
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  flutter_markdown_plus: ^1.0.12
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0

  # on-device nameplate OCR (FR-1.5) — pre-fills observation fields, never
  # auto-submits; see lib/core/ocr/nameplate_ocr.dart
  google_mlkit_text_recognition: ^0.17.1
  camera: ^0.12.1
  sensors_plus: ^7.1.0
  sqflite_sqlcipher: ^3.4.1

  # FR-3.4 — downscaling a photo the in-app camera captured itself
  # (camera_capture_screen.dart). image_picker's maxWidth/imageQuality does
  # this for every OTHER capture path in the app, but that plugin launches
  # the OS camera and hands back a finished file — it never runs for a shot
  # taken through camera's own CameraController, which is why this needed
  # its own resize step.
  image: ^4.5.4
  workmanager: ^0.10.10
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/public/app_icon_source.png"
  adaptive_icon_foreground: "assets/public/app_icon_source.png"
  adaptive_icon_background: "#01143F"
  web:
    generate: true
    image_path: "assets/public/app_icon_source.png"
    background_color: "#0175C2"
    theme_color: "#0175C2"

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/public/
    # The model viewer's page (docs/bim-viewer.md): served to its WebView by
    # the app's loopback server. Folders aren't recursive, so vendor/ too.
    - assets/bim_viewer/
    - assets/bim_viewer/vendor/
